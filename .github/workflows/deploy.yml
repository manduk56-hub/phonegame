name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dirt-rally-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Check deployment scripts
        run: |
          for script in deploy/git-deploy.sh deploy/setup-git-deploy.sh deploy/git-deploy-gateway.sh; do
            bash -n "$script"
          done

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Ask server to deploy this Git commit
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Set production variable DEPLOY_HOST}"
          : "${DEPLOY_USER:?Set production variable DEPLOY_USER}"
          : "${DEPLOY_KEY:?Set production secret DEPLOY_SSH_KEY}"
          : "${KNOWN_HOSTS:?Set production secret DEPLOY_KNOWN_HOSTS}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 "$DEPLOY_USER@$DEPLOY_HOST" "deploy $COMMIT"
